<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6E2F46">
<link rel="manifest" href="manifest.json">
<title>Etiqueta85</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head><body>
<div class="app">
<h1>Etiqueta85</h1>
<p class="sub">85 DESAPEGO</p>

<label>Último código</label>
<input id="ultimo" type="number">

<label>Categoria</label>
<select id="categoria">
<option>Vestido</option><option>Blusa</option><option>Calça</option>
<option>Saia</option><option>Short</option><option>Blazer</option>
</select>

<label>Tamanho</label>
<select id="tam"><option>PP</option><option>P</option><option selected>M</option><option>G</option><option>GG</option></select>

<label>Preço</label>
<input id="preco" placeholder="89,90">

<button onclick="gerar()">Gerar etiqueta</button>

<div id="preview" class="hide">
<div class="etiqueta">
<div class="logo">85 DESAPEGO</div>
<div class="linha"><span id="cat"></span><span>Tam <span id="tamanho"></span></span></div>
<div class="preco">R$ <span id="valor"></span></div>
<svg id="barcode"></svg>
<div id="sku" class="sku"></div>
</div>
<button onclick="window.print()">🖨️ Imprimir</button>
</div>
</div>
<script src="app.js"></script>
</body></html>
